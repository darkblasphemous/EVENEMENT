<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTER - Scan de Pointage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            width: 80%;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultat {
            margin-top: 20px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Système de Pointage ASTER</h2>
        <p>Scannez ou entrez l'ID du membre :</p>
        
        <input type="text" id="idMembreInput" placeholder="Ex: MEMBRE-0031" autofocus>
        <br>
        <button onclick="validerScanManuel()">Valider le pointage</button>
        
        <div id="resultat"></div>
    </div>

    <script>
        // URL de ton application web Google Apps Script
        const urlWebapp = "https://script.google.com/macros/s/AKfycbyuAxrqWFMq-2q4tBWAshIgUTBEKvHFaX1TS8-xMTRen-CRS01jtuscFT81Vk_FATya/exec";

        function envoyerScan(idMembre) {
            if (!idMembre) {
                alert("Veuillez entrer un ID valide.");
                return;
            }

            const zoneResultat = document.getElementById("resultat");
            zoneResultat.innerText = "Validation en cours...";
            zoneResultat.style.color = "orange";

            fetch(urlWebapp, {
                method: "POST",
                body: JSON.stringify({ idMembre: idMembre }),
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                }
            })
            .then(response => response.text())
            .then(messageDuServeur => {
                zoneResultat.innerText = messageDuServeur;
                
                if (messageDuServeur.includes("SUCCES")) {
                    zoneResultat.style.color = "green";
                } else {
                    zoneResultat.style.color = "red";
                }

                // Réinitialise le champ input pour le prochain scan
                document.getElementById("idMembreInput").value = "";
                document.getElementById("idMembreInput").focus();
            })
            .catch(erreur => {
                console.error("Erreur:", erreur);
                zoneResultat.innerText = "Erreur de communication avec le serveur.";
                zoneResultat.style.color = "red";
            });
        }

        function validerScanManuel() {
            const idMembre = document.getElementById("idMembreInput").value.trim();
            envoyerScan(idMembre);
        }

        // Permet de valider directement en appuyant sur la touche "Entrée"
        document.getElementById("idMembreInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                validerScanManuel();
            }
        });
    </script>

</body>
</html>
